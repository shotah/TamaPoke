; TamaPoke — selectable Waveshare ESP32-S3 boards
;
; Arduino-ESP32 3.2.0: 3.1.2/3.1.3 I2S+PSRAM puts the GDMA callback in PSRAM
; (silent speaker). Begin Wire once and pass -1,-1 into SensorLib / XPowers
; so 3.2+ i2c-ng does not see a second setPins.
;
; Default env is the original 1.75 AMOLED. 1.85C V2 is opt-in:
;   pio run -e lcd_185c
;   make BOARD=lcd_185c upload

[platformio]
default_envs = amoled_175
src_dir = .
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_src_filter =
    +<TamaPoke.ino>
    +<*.cpp>
    -<tools/>
    -<web/>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lewisxhe/SensorLib@^0.3.1

[env:amoled_175]
board = amoled_175/board
build_flags =
    ${env.build_flags}
    -DTAMAPOKE_BOARD_DIR=amoled_175
lib_deps =
    ${env.lib_deps}
    lewisxhe/XPowersLib@^0.2.9

[env:lcd_185c]
board = lcd_185c/board
build_flags =
    ${env.build_flags}
    -DTAMAPOKE_BOARD_DIR=lcd_185c
