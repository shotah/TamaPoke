; TamaPoke — Waveshare ESP32-S3-Touch-LCD-1.85C V2
;
; Arduino-ESP32 3.x is required (ESP_I2S, SD_MMC.setPins). Stock PlatformIO
; espressif32 still ships 2.x, so this uses pioarduino.
;
; Arduino 3.2.0: 3.1.2/3.1.3 I2S+PSRAM puts the GDMA callback in PSRAM
; (silent speaker). 3.3.x i2c-ng is avoided by beginning Wire once.

[platformio]
default_envs = waveshare-lcd-185c
src_dir = .
boards_dir = boards

[env:waveshare-lcd-185c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = waveshare-esp32-s3-touch-lcd-1.85c
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0
; Hardware CDC / USB-Serial/JTAG: do not 1200bps-touch (that is TinyUSB).
; RTS ioctl on this ACM device raises errno 71 ("Protocol error").
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Keep the Arduino sketch layout. Do not compile tools/ or web/.
build_src_filter =
    +<TamaPoke.ino>
    +<*.cpp>
    -<tools/>
    -<web/>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lewisxhe/SensorLib@^0.3.1
